name: Deploy Backend to Google Cloud Run

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: crm-backend
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/crm-backend/crm-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Google Auth
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Create Artifact Registry repository (if not exists)
      run: |
        gcloud artifacts repositories describe crm-backend \
          --location=us-central1 \
          --project=${{ secrets.GCP_PROJECT_ID }} 2>/dev/null || \
        gcloud artifacts repositories create crm-backend \
          --repository-format=docker \
          --location=us-central1 \
          --project=${{ secrets.GCP_PROJECT_ID }} \
          --description="CRM Backend Docker images"

    - name: Authorize Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Build and Push Container
      run: |-
        docker build -t ${{ env.IMAGE }}:${{ github.sha }} ./backend
        docker build -t ${{ env.IMAGE }}:latest ./backend
        docker push ${{ env.IMAGE }}:${{ github.sha }}
        docker push ${{ env.IMAGE }}:latest

    - name: Deploy to Cloud Run
      run: |-
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.IMAGE }}:${{ github.sha }} \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --set-env-vars "SPRING_DATASOURCE_URL=${{ secrets.DB_URL }},SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }},SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }},JWT_SECRET=${{ secrets.JWT_SECRET }}"

    - name: Show deployed URL
      run: |
        echo "✅ Backend deployed successfully!"
        gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region ${{ env.REGION }} \
          --format='value(status.url)'
